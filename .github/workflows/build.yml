name: Build

on:
  push:
    paths:
      - "**.gradle"
      - "**.properties"
      - "**.java"
      - "**.toml"
      - "**.xml"
      - ".github/workflows/*.yml"
    branches:
      - "**"
  pull_request:
    branches:
      - main
jobs:
  fullbuild:
    runs-on: ubuntu-latest

    name: Build and Verify
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: JDK Setup
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: D-BUS AT-SPI Installation
        run: sudo apt-get -y install at-spi2-core

      - name: Build
        run: ./gradlew build -x test -PskipSpotless

      - name: Test
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1.0.1
        with:
          run: ./gradlew jacocoTestReport -PskipSpotless

      - name: Publish Test Results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: JUnit test results
          reporter: java-junit
          path: '**/test-results/**/*.xml'
      # TODO: Re-enable SonarCloud analysis once fully compatible with Gradle 9: https://community.sonarsource.com/t/sonar-scanner-gradle-incompatible-with-gradle-9/145563
      #      - name: Static Analysis
      #        env:
      #          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #        if: github.repository == 'gurkenlabs/litiengine'
      #        run: ./gradlew sonar -PskipSpotless

      - name: Code Style Validation
        run: ./gradlew spotlessCheck

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: JDK Setup
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Test
        run: ./gradlew test -PskipSpotless --stacktrace --info --console=plain

      - name: Package application image
        if: always()
        run: ./gradlew :utiliti:jpackage -PskipSpotless --stacktrace --console=plain

      - name: Dump failed tests
        if: always()
        run: |
          find . -name "TEST-*.xml" -exec grep -Hn -E '<failure|<error' {} + || true

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: JUnit test results (macOS ${{ matrix.arch }})
          reporter: java-junit
          path: '**/test-results/**/*.xml'

