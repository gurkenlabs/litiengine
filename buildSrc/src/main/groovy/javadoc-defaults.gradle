tasks.withType(Javadoc).configureEach {
  def assetsDir = rootProject.file("config/javadoc/assets")
  def themeCss = rootProject.file("config/javadoc/litiengine.css")
  def themeJs = rootProject.file("config/javadoc/litiengine.js")

  if (assetsDir.exists()) {
    inputs.dir(assetsDir)
  }
  if (themeCss.exists()) {
    inputs.file(themeCss)
  }
  if (themeJs.exists()) {
    inputs.file(themeJs)
  }

  options.encoding = "UTF-8"
  options.charSet = "UTF-8"
  options.docEncoding = "UTF-8"

  def engineName = project.findProperty("LITIENGINE_name") ?: "LITIENGINE"
  def engineUrl = project.findProperty("LITIENGINE_url") ?: "https://litiengine.com/"
  def copyrightText = project.findProperty("copyright") ?: "gurkenlabs"
  def mitName = project.findProperty("MIT_name") ?: "MIT"
  def mitUrl = project.findProperty("MIT_url") ?: "https://mit-license.org/"

  options.windowTitle = "${engineName} API"
  options.docTitle = "${engineName} API Documentation"
  options.header = """<a href="${engineUrl}" target="_blank" class="nav-brand-link"><b>${engineName} 🎮</b> API</a>"""
  options.bottom = """<p class="legal-copy"><small>Copyright &#169; ${copyrightText}. Released under the <a href="${mitUrl}" target="_blank">${mitName} License</a>.</small></p>"""

  if (themeCss.exists()) {
    options.addStringOption("-add-stylesheet", themeCss.absolutePath)
  }
  if (themeJs.exists()) {
    options.addStringOption("-add-script", themeJs.absolutePath)
  }

  doLast {
    if (assetsDir.exists() && destinationDir) {
      project.copy {
        from assetsDir
        into "${destinationDir}/assets"
      }
      project.copy {
        from assetsDir
        into "${destinationDir}/resource-files"
      }
    }

    // Generation-time HTML adjustments (Favicons, Fonts, SEO/GEO metadata, Bottom Tags, and Footer)
    if (destinationDir && destinationDir.exists()) {
      destinationDir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
        if (file.name.endsWith(".html")) {
          enhanceJavadocHtml(file, destinationDir)
        }
      }
    }
  }
}

void enhanceJavadocHtml(File file, File rootDir) {
  def relPath = rootDir.toPath().relativize(file.toPath().getParent() ?: rootDir.toPath()).toString().replace('\\', '/')
  def r = relPath ? (relPath.split('/').collect { '..' }.join('/') + '/') : ''

  def html = file.getText("UTF-8")
  if (html.contains("<!-- liti-enhanced -->")) return

  // 1. Favicons & Fonts in <head>
  def headAdditions = """
  <!-- liti-enhanced -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Montserrat:wght@400;500;600;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="${r}assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="${r}assets/favicon-16x16.png">
  <link rel="shortcut icon" href="${r}assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="48x48" href="${r}assets/favicon-48x48.png">
  <meta name="theme-color" content="#0b0c0f">
  <meta name="author" content="GURKENLABS">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="generator" content="Java 25 Javadoc with LITIENGINE Theme">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="LITIENGINE API Documentation">
  <meta property="og:image" content="https://gurkenlabs.github.io/litiengine-docs/assets/logo.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://gurkenlabs.github.io/litiengine-docs/assets/logo.png">
  <meta name="twitter:site" content="@gurkenlabs">
"""

  // Extract Page Title
  def titleMatcher = (html =~ /<title>(.*?)<\/title>/)
  def pageTitle = titleMatcher ? titleMatcher[0][1] : "LITIENGINE API"
  def cleanHeading = pageTitle.replaceAll(/\s*\(.*?\)\s*$/, '')
  headAdditions += """  <meta name="description" content="Official Java API reference documentation for ${cleanHeading} in the LITIENGINE 2D Game Engine.">
  <meta property="og:title" content="${cleanHeading} | LITIENGINE API">
  <meta property="og:description" content="Official Java API reference documentation for ${cleanHeading} in the LITIENGINE 2D Game Engine.">
  <meta name="twitter:title" content="${cleanHeading} | LITIENGINE API">
  <meta name="twitter:description" content="Official Java API reference documentation for ${cleanHeading} in the LITIENGINE 2D Game Engine.">
"""

  if (html.contains("</head>")) {
    html = html.replace("</head>", headAdditions + "\n</head>")
  }

  // 2. Build Contextual Tags at generation time
  def tags = [] as Set
  def pathLower = file.absolutePath.toLowerCase().replace('\\', '/')

  if (html.contains("class-declaration-page")) {
    if (cleanHeading.startsWith("Interface ")) tags.add("interface")
    else if (cleanHeading.startsWith("Enum Class ") || cleanHeading.startsWith("Enum ")) tags.add("enum")
    else if (cleanHeading.startsWith("Record Class ") || cleanHeading.startsWith("Record ")) tags.add("record")
    else if (cleanHeading.startsWith("Annotation Interface ")) tags.add("annotation")
    else tags.add("class")
  } else if (html.contains("package-declaration-page")) {
    tags.add("package")
  } else if (html.contains("tree-page")) {
    tags.add("hierarchy")
    tags.add("tree")
  } else if (html.contains("index-page")) {
    tags.add("index")
  }

  if (pathLower.contains("/abilities/") || cleanHeading.contains("Ability")) tags.add("abilities")
  if (pathLower.contains("/graphics/") || cleanHeading.contains("Sprite") || cleanHeading.contains("Render")) tags.add("graphics")
  if (pathLower.contains("/sound/") || cleanHeading.contains("Sound") || cleanHeading.contains("Track")) tags.add("sound")
  if (pathLower.contains("/physics/") || cleanHeading.contains("Collision") || cleanHeading.contains("Raycast")) tags.add("physics")
  if (pathLower.contains("/entities/") || cleanHeading.contains("Creature") || cleanHeading.contains("Entity")) tags.add("entities")
  if (pathLower.contains("/gui/") || cleanHeading.contains("Menu") || cleanHeading.contains("Component")) tags.add("gui")
  if (pathLower.contains("/input/") || cleanHeading.contains("Gamepad") || cleanHeading.contains("Keyboard")) tags.add("input")
  if (pathLower.contains("/environment/") || cleanHeading.contains("Map")) tags.add("maps")
  if (pathLower.contains("/tweening/") || cleanHeading.contains("Tween")) tags.add("animation")

  if (cleanHeading.endsWith("Listener")) tags.add("listener")
  if (cleanHeading.endsWith("Event")) tags.add("event")
  if (cleanHeading.endsWith("Controller")) tags.add("controller")
  if (html.contains("deprecation-block") || html.contains("deprecated-label")) tags.add("deprecated")

  if (tags.size() < 4) tags.add("api")
  if (tags.size() < 5) tags.add("java")

  if (tags && html.contains("</main>")) {
    def tagHtml = new StringBuilder('<nav class="md-tags" aria-label="Tags">')
    tags.each { t ->
      def cls = t == 'deprecated' ? 'md-tag md-tag--deprecated' : 'md-tag'
      tagHtml.append("<span class=\"${cls}\">${t}</span>")
    }
    tagHtml.append('</nav>')
    html = html.replace("</main>", tagHtml.toString() + "\n</main>")
  }

  // 3. Social Footer
  def footerHtml = """
<footer>
  <div class="md-social">
    <a href="https://github.com/gurkenlabs/litiengine" target="_blank" rel="noopener noreferrer" class="md-social__link" title="GitHub" aria-label="GitHub">
      <svg class="github-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
    </a>
    <a href="https://discord.gg/fvcfA6k" target="_blank" rel="noopener noreferrer" class="md-social__link" title="Discord" aria-label="Discord">
      <svg class="discord-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
    </a>
    <a href="https://twitter.com/gurkenlabs" target="_blank" rel="noopener noreferrer" class="md-social__link" title="Twitter" aria-label="Twitter">
      <svg class="twitter-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </a>
  </div>
  <div class="md-copyright">
    <span>Copyright &copy; 2026 GURKENLABS &middot; Released under the <a href="https://mit-license.org/" target="_blank" rel="noopener noreferrer">MIT License</a></span>
  </div>
</footer>
"""

  if (html.contains("<footer>")) {
    html = html.replaceAll(/(?s)<footer>.*?<\/footer>/, footerHtml)
  } else if (html.contains("</body>")) {
    html = html.replace("</body>", footerHtml + "\n</body>")
  }

  file.setText(html, "UTF-8")
}
